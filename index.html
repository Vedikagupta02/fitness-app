<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
    <title>Fitness Hub</title>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 tracking-tight mb-3">Fitness Hub</h1>
            <p class="text-gray-500">Track your daily movements and nutrition.</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Movement Tracker Card -->
            <a href="movement.html" class="group bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-emerald-200 transition-all flex flex-col items-center text-center">
                <div class="bg-emerald-50 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h2 class="text-lg font-semibold text-gray-800 mb-1">Movement</h2>
                <p class="text-sm text-gray-500">Log your workouts and exercises</p>
            </a>

            <!-- Calorie Tracker Card -->
            <a href="calorie.html" class="group bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-orange-200 transition-all flex flex-col items-center text-center">
                <div class="bg-orange-50 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <h2 class="text-lg font-semibold text-gray-800 mb-1">Calories</h2>
                <p class="text-sm text-gray-500">Track your daily food intake</p>
            </a>
        </div>
    </div>
</body>
</html>
